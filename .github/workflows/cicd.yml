name: CI/CD Pipeline

on:
  push:
    branches:
      - '**'

jobs:
  continuous-integration:
    name: Continuous Integration (CI)
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout kod
        uses: actions/checkout@v4

      - name: Podešavanje Python okruženja
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Instalacija zavisnosti za Payment servis
        run: |
          python -m pip install --upgrade pip
          pip install -r payment/requirements.txt
          pip install pytest pytest-asyncio

      - name: Pokretanje svih testova (Unit, Integration, Functional)
        env:
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          REDIS_PASSWORD: ""
        run: |
          cd payment
          pytest

  continuous-deployment:
    name: Continuous Deployment (CD)
    needs: continuous-integration
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'

    steps:
      - name: Checkout kod
        uses: actions/checkout@v4

      - name: Logovanje na DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Setovanje Docker Tag-a na osnovu grane
        id: vars
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "tag=latest" >> $GITHUB_OUTPUT
          else
            echo "tag=develop" >> $GITHUB_OUTPUT
          fi

      - name: Build-ovanje i Push-ovanje Docker slike
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/payment-service:${{ steps.vars.outputs.tag }}