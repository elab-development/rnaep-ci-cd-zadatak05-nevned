name: CI/CD Pipeline

on:
  push:
    branches:
      - '**'

jobs:
  continuous-integration:
    name: Continuous Integration (CI)
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout kod
        uses: actions/checkout@v4

      - name: Podešavanje Python okruženja
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Instalacija zavisnosti za Payment servis
        run: |
          python -m pip install --upgrade pip
          pip install -r payment/requirements.txt
          pip install pytest pytest-asyncio

      - name: Pokretanje svih testova (Unit, Integration, Functional)
        env:
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          REDIS_PASSWORD: ""
          PYTHONPATH: payment
        run: |
          cd payment
          pytest